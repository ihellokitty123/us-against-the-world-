<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby</title>
    <style>
        :root {
            --pink-bg: #fff0f3;
            --pink-accent: #ff85a1;
            --deep-pink: #ff4d6d;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--pink-bg);
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Realistic Flower Animation */
        .flower {
            position: absolute;
            width: 40px; height: 40px;
            background: url('https://img.icons8.com/emoji/96/cherry-blossom.png') no-repeat center/contain;
            z-index: 1;
            animation: fall 10s infinite linear;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Start Button Overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
            color: var(--deep-pink);
            font-size: 3rem;
            text-align: center;
            padding: 20px;
        }

        /* Big Word Intro */
        #big-word-display {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--pink-bg);
            z-index: 1500;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 7rem;
            color: var(--deep-pink);
            font-weight: 900;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.1);
        }

        /* Main Stage */
        #stage {
            display: none;
            width: 100%; height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .photo-container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(255, 133, 161, 0.5);
            border-radius: 10px;
            object-fit: cover;
            transition: all 1.2s ease-in-out;
            opacity: 0;
            z-index: 5;
        }

        /* The Heart Message - Stacked */
        #final-message {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--deep-pink);
            font-weight: bold;
            font-size: 2.2rem;
            text-align: center;
            z-index: 20;
            line-height: 1.2;
        }

        /* Lyrics */
        #lyrics {
            position: fixed;
            bottom: 120px;
            font-size: 1.8rem;
            color: var(--deep-pink);
            text-align: center;
            width: 100%;
            height: 60px;
            text-shadow: 1px 1px 2px white;
        }

        /* Large Pink Fluffy Cat */
        .cat-container {
            position: fixed;
            bottom: -20px;
            left: -200px;
            z-index: 100;
            animation: walkAcross 15s infinite linear;
        }

        .cat-img {
            width: 150px;
            filter: drop-shadow(0 0 10px pink);
        }

        @keyframes walkAcross {
            from { left: -200px; }
            to { left: 100vw; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startSurprise()">Tap to see how much I love you... 🌸</div>

    <div id="big-word-display"></div>

    <div id="stage">
        <div class="photo-container" id="photo-box">
            <div id="final-message">
                <span>I</span>
                <span>WOULD</span>
                <span>DIE</span>
                <span>FOR YOU</span>
            </div>
        </div>
        <div id="lyrics"></div>
    </div>

    <div class="cat-container">
        <img src="https://img.icons8.com/plasticine/200/cat--v1.png" class="cat-img" alt="Pink Cat">
    </div>

    <audio id="song" src="song.mp3"></audio>

    <script>
        const song = document.getElementById('song');
        const overlay = document.getElementById('overlay');
        const wordDisplay = document.getElementById('big-word-display');
        const stage = document.getElementById('stage');
        const lyricsBox = document.getElementById('lyrics');
        const photoBox = document.getElementById('photo-box');

        // Create 50 realistic Flowers
        for(let i=0; i<50; i++) {
            const f = document.createElement('div');
            f.className = 'flower';
            f.style.left = Math.random() * 100 + 'vw';
            f.style.animationDelay = Math.random() * 10 + 's';
            f.style.transform = `scale(${0.5 + Math.random()})`;
            document.body.appendChild(f);
        }

        function startSurprise() {
            overlay.style.display = 'none';
            song.play();
            showSequence();
        }

        async function showSequence() {
            wordDisplay.style.display = 'flex';
            const words = ["I", "LOVE", "YOU", "BABY"];
            for(let w of words) {
                wordDisplay.innerText = w;
                await new Promise(r => setTimeout(r, 1200)); // Longer pause as requested
            }
            wordDisplay.style.display = 'none';
            runMainShow();
        }

        function runMainShow() {
            stage.style.display = 'flex';
            
            // Sync lyrics with the specific start you mentioned
            const lines = [
                {t: 0, text: "I'm finding ways to say..."},
                {t: 4000, text: "I'm finding ways to say "},
                {t: 8000, text: "I love you..."},
                {t: 12000, text: "I hate it when you cry..."}
            ];

            lines.forEach(line => {
                setTimeout(() => { lyricsBox.innerText = line.text; }, line.t);
            });

            // Heart Coordinates (Spaced out perfectly for 16 photos)
            const heartCoords = [
                {x: 300, y: 150}, {x: 220, y: 100}, {x: 120, y: 130}, {x: 80, y: 230},
                {x: 110, y: 350}, {x: 200, y: 450}, {x: 300, y: 530}, {x: 400, y: 450},
                {x: 490, y: 350}, {x: 520, y: 230}, {x: 480, y: 130}, {x: 380, y: 100},
                {x: 300, y: 250}, {x: 240, y: 200}, {x: 360, y: 200}, {x: 300, y: 380}
            ];

            for(let i=1; i<=16; i++) {
                const img = document.createElement('img');
                img.src = `Photo${i}.jpg`;
                img.className = 'photo';
                // Swipe in from different sides
                img.style.left = i % 2 === 0 ? "-300px" : "900px";
                img.style.top = Math.random() * 500 + "px";
                photoBox.appendChild(img);

                // Swipe-in timing
                setTimeout(() => {
                    img.style.opacity = '1';
                    img.style.left = (heartCoords[i-1].x - 50) + "px";
                    img.style.top = (heartCoords[i-1].y - 50) + "px";
                    
                    if(i === 16) {
                        setTimeout(() => {
                            document.getElementById('final-message').style.display = 'flex';
                        }, 1500);
                    }
                }, 1000 + (i * 800)); // Swiping sequence
            }
        }
    </script>
</body>
</html>
