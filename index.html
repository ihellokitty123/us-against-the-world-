<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forever</title>
    <style>
        :root {
            --pink-bg: #ffe5ec;
            --pink-accent: #ff85a1;
            --text-color: #ff4d6d;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--pink-bg);
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Floating Lilies - Lots of them! */
        .lily {
            position: absolute;
            font-size: 30px;
            z-index: 1;
            animation: floatUp 8s infinite linear;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* Countdown & Big Text */
        #overlay {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
            color: var(--pink-accent);
            font-size: 5rem;
            font-weight: bold;
        }

        #big-word-display {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--pink-bg);
            z-index: 1500;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8rem;
            color: var(--text-color);
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 4px 4px 0px white;
        }

        /* Main Stage */
        #stage {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* Photo Slider and Heart Container */
        .photo-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 20px;
        }

        .photo {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 6px solid white;
            outline: 3px solid var(--pink-accent); /* Floral-like border effect */
            border-radius: 15px;
            object-fit: cover;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0);
        }

        /* Lyrics */
        #lyrics {
            font-size: 1.5rem;
            color: var(--text-color);
            text-align: center;
            max-width: 80%;
            height: 50px;
            margin-top: 20px;
            text-shadow: 1px 1px 2px white;
        }

        /* Running Fluffy Cats */
        .cat-parade {
            position: fixed;
            bottom: 10px;
            font-size: 50px;
            white-space: nowrap;
            animation: runAcross 12s infinite linear;
            z-index: 100;
        }

        @keyframes runAcross {
            from { left: -500px; }
            to { left: 100vw; }
        }

        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            color: white;
            font-size: 2rem;
            background: rgba(255, 77, 109, 0.8);
            padding: 10px 20px;
            border-radius: 50px;
            display: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startEngine()">Tap to Start ❤️</div>

    <div id="big-word-display"></div>

    <div id="stage">
        <div class="photo-container" id="photo-box">
            <div id="final-message">I WOULD DIE FOR YOU ❤️</div>
        </div>
        <div id="lyrics"></div>
    </div>

    <div class="cat-parade">🐈🌸🐈‍⬛🌷🐈🌸🐈‍⬛🌷</div>

    <audio id="song" src="song.mp3"></audio>

    <script>
        const song = document.getElementById('song');
        const overlay = document.getElementById('overlay');
        const wordDisplay = document.getElementById('big-word-display');
        const stage = document.getElementById('stage');
        const lyricsBox = document.getElementById('lyrics');
        const photoBox = document.getElementById('photo-box');

        // Create 40 Lilies
        for(let i=0; i<40; i++) {
            const lily = document.createElement('div');
            lily.className = 'lily';
            lily.innerHTML = '🪷';
            lily.style.left = Math.random() * 100 + 'vw';
            lily.style.animationDelay = Math.random() * 8 + 's';
            document.body.appendChild(lily);
        }

        function startEngine() {
            let count = 3;
            overlay.innerText = count;
            const timer = setInterval(() => {
                count--;
                if(count > 0) overlay.innerText = count;
                else if(count === 0) overlay.innerText = "GO!";
                else {
                    clearInterval(timer);
                    overlay.style.display = 'none';
                    song.play();
                    showLoveWords();
                }
            }, 1000);
        }

        async function showLoveWords() {
            wordDisplay.style.display = 'flex';
            const words = ["I", "LOVE", "YOU", "SO", "MUCH", "BABY"];
            for(let w of words) {
                wordDisplay.innerText = w;
                await new Promise(r => setTimeout(r, 800));
            }
            wordDisplay.style.display = 'none';
            startMainSequence();
        }

        function startMainSequence() {
            stage.style.display = 'flex';
            
            // Lyrics timing (adjust these numbers to match your song beats)
            const lines = [
                {t: 0, text: "Even though we're going through it..."},
                {t: 3000, text: "And you feel alone..."},
                {t: 6000, text: "Just know that I will love you."}
            ];

            lines.forEach(line => {
                setTimeout(() => { lyricsBox.innerText = line.text; }, line.t);
            });

            // Create 16 Photos
            const heartCoords = [
                {x: 200, y: 100}, {x: 140, y: 60}, {x: 70, y: 80}, {x: 50, y: 150},
                {x: 80, y: 240}, {x: 140, y: 300}, {x: 200, y: 360}, {x: 260, y: 300},
                {x: 320, y: 240}, {x: 350, y: 150}, {x: 330, y: 80}, {x: 260, y: 60},
                {x: 200, y: 180}, {x: 160, y: 180}, {x: 240, y: 180}, {x: 200, y: 260}
            ];

            for(let i=1; i<=16; i++) {
                const img = document.createElement('img');
                img.src = `Photo${i}.jpg`;
                img.className = 'photo';
                // Start them off-screen for the "swipe" effect
                img.style.left = "-200px";
                img.style.top = "150px";
                photoBox.appendChild(img);

                // Slide them in one by one to the beat
                setTimeout(() => {
                    img.style.opacity = '1';
                    img.style.transform = 'scale(1)';
                    // Move to heart position
                    img.style.left = (heartCoords[i-1].x - 60) + "px";
                    img.style.top = (heartCoords[i-1].y - 60) + "px";
                    
                    if(i === 16) {
                        setTimeout(() => {
                            document.getElementById('final-message').style.display = 'block';
                        }, 1000);
                    }
                }, 8000 + (i * 600)); // Starts after words, slides every 0.6s
            }
        }
    </script>
</body>
</html>
